# Servo-Switch für die Buderus-Brauchwasser-Wärmepumpe
# Ein Micro-Servo drückt auf Befehl aus Home Assistant eine Taste am Bedienfeld
# der Wärmepumpe (hier: Heizstab). Die rote LED leuchtet, solange der Ablauf läuft.
# Details, Druckteile und Verdrahtung: README.md

substitutions:
  device: servo_esphome          # Gerätename in ESPHome (frei wählbar)
  switch_name: "WP_servo_switch" # Name des Schalters in Home Assistant
  up_position: -55%              # Taststellung: Finger drückt auf die Taste
  down_position: 20%             # Parkstellung: Finger weg von der Taste
  center_position: 20%
  frequenz: 40 Hz                # PWM-Frequenz des Servos

esphome:
  name: wp-servo
  friendly_name: wp_servo

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret wp_servo_encryption_key

ota:
  - platform: esphome
    password: !secret wp_servo_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Feste IP – an das eigene Netz anpassen oder den Block entfernen (DHCP)
  manual_ip:
    static_ip: 192.168.178.64
    gateway: 192.168.178.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wp-Servo Fallback Hotspot"
    password: !secret wp_servo_ap_password

captive_portal:

# Rote LED an D2: leuchtet während des Tastendrucks
light:
  - platform: monochromatic
    output: output_red
    id: red_led

output:
  # Servo-Signal an D1
  - platform: esp8266_pwm
    id: pwm_output
    pin:
      number: D1
    frequency: ${frequenz}

  - platform: esp8266_pwm
    id: output_red
    pin:
      number: D2


servo:
  - id: my_servo
    output: pwm_output

# Die Taste an der Wärmepumpe schaltet um – deshalb drücken Ein und Aus gleich.
switch:
  - platform: template
    name: ${switch_name}
    optimistic: false
    turn_on_action:
      - script.execute: move_up
    turn_off_action:
      - script.execute: move_down

script:
  - id: move_up
    then:
      - light.turn_on: red_led
      - delay: 2s
      - servo.write:
          id: my_servo
          level: ${up_position}
      - delay: 1s
      - servo.write:
          id: my_servo
          level: ${down_position}
      - delay: 2s
      - servo.detach: my_servo
      - light.turn_off: red_led

  - id: move_down
    then:

      - delay: 2s
      - servo.write:
          id: my_servo
          level: ${up_position}
      - delay: 1s
      - servo.write:
          id: my_servo
          level: ${down_position}
      - delay: 2s
      - servo.detach: my_servo
      - light.turn_off: red_led
